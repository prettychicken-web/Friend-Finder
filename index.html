<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Friend Finder</title>
  <style>
    body { font: 16px system-ui, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 16px; }
    label, input, button { display: block; margin: 12px 0; }
    input { padding: 8px; width: 100%; box-sizing: border-box; }
    button { padding: 10px 16px; cursor: pointer; }
    .card { border: 1px solid #ccc; border-radius: 10px; padding: 16px; margin: 12px 0; }
  </style>
</head>
<body>
  <h1>Friend Finder</h1>
  <p>Enter a few interests to see people who share them.</p>

  <label for="interests">Your interests, separated by commas</label>
  <input id="interests" placeholder="music, gaming, hiking">
  <button id="find">Find people</button>

  <div id="results" aria-live="polite"></div>

  <script>
    const people = [
      { name: "Alex", interests: ["music", "hiking", "cooking"] },
      { name: "Jordan", interests: ["gaming", "movies", "music"] },
      { name: "Sam", interests: ["books", "hiking", "art"] }
    ];

    document.querySelector("#find").addEventListener("click", () => {
      const mine = document.querySelector("#interests").value
        .toLowerCase()
        .split(",")
        .map(item => item.trim())
        .filter(Boolean);

      const matches = people
        .map(person => ({
          ...person,
          shared: person.interests.filter(interest => mine.includes(interest))
        }))
        .filter(person => person.shared.length > 0)
        .sort((a, b) => b.shared.length - a.shared.length);

      const results = document.querySelector("#results");
      results.replaceChildren();

      if (matches.length === 0) {
        results.textContent = "No matches yet. Try a different interest.";
        return;
      }

      for (const person of matches) {
        const card = document.createElement("section");
        card.className = "card";

        const title = document.createElement("h2");
        title.textContent = person.name;

        const details = document.createElement("p");
        details.textContent = `Shared interests: ${person.shared.join(", ")}`;

        card.append(title, details);
        results.append(card);
      }
    });
  </script>
</body>
</html>
